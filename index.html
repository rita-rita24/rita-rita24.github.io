<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="アリエッティ-プロフィール" />
    <title>アリエッティ-プロフィール</title>
    <link rel="stylesheet" href="styles/style.css?v=20261007-hd" />
  </head>
  <body>
    <main class="profile-page" aria-label="アリエッティ プロフィール ページ">
      <div class="profile-frame">
        <div class="profile-stage">
          <article class="profile-card">
            <section class="left-panel" aria-label="プロフィール概要">
              <div class="photo-card">
                <img src="images/profile-hd/profile-photo.png" width="1024" height="1536" alt="アリエッティのイラスト" class="photo-inner" />
              </div>

              <div class="name-mark">アリエッティ</div>
              <div class="name-rule" aria-hidden="true"></div>

              <p class="lead-copy">
                ものづくりが好きなフロントエンドエンジニアです。<br />
                ユーザーに価値を届けるプロダクトをつくります。
              </p>
            </section>

            <section class="right-panel" aria-label="プロフィール詳細">
              <img src="images/profile-hd/branch-top.png" width="1536" height="1024" alt="" class="branch-top" />
              <div class="profile-table">
                <div class="profile-row">
                  <img src="images/profile-hd/icon-user.png" width="1254" height="1254" alt="" class="row-icon" />
                  <div class="row-label">ニックネーム</div>
                  <div class="dot-rule" aria-hidden="true"></div>
                  <div class="row-value"><span>アリエッティ</span></div>
                </div>
                <div class="profile-row">
                  <img src="images/profile-hd/icon-code.png" width="1254" height="1254" alt="" class="row-icon" />
                  <div class="row-label">得意な技術</div>
                  <div class="dot-rule" aria-hidden="true"></div>
                  <div class="row-value"><span>Laravel / JavaScript</span></div>
                </div>
                <div class="profile-row">
                  <img src="images/profile-hd/icon-food.png" width="1254" height="1254" alt="" class="row-icon" />
                  <div class="row-label">好きな食べ物</div>
                  <div class="dot-rule" aria-hidden="true"></div>
                  <div class="row-value"><span><span class="preference-item">いくら、</span><wbr><span class="preference-item">お刺身、</span><wbr><span class="preference-item">お寿司、</span><wbr><span class="preference-item">アイスクリーム</span></span></div>
                </div>
                <div class="profile-row">
                  <img src="images/profile-hd/icon-sad.png" width="1254" height="1254" alt="" class="row-icon" />
                  <div class="row-label">苦手な食べ物</div>
                  <div class="dot-rule" aria-hidden="true"></div>
                  <div class="row-value"><span><span class="preference-item">紅しょうが、</span><wbr><span class="preference-item">きゅうり</span></span></div>
                </div>
                <div class="profile-row">
                  <img src="images/profile-hd/icon-book.png" width="1254" height="1254" alt="" class="row-icon" />
                  <div class="row-label">好きな漫画</div>
                  <div class="dot-rule" aria-hidden="true"></div>
                  <div class="row-value"><span><span class="preference-item">呪術廻戦、</span><wbr><span class="preference-item">ブルーロック、</span><wbr><span class="preference-item">寄生獣、</span><wbr><span class="preference-item">BELACH、</span><wbr><span class="preference-item">バーサス</span></span></div>
                </div>
                <div class="profile-row">
                  <img src="images/profile-hd/icon-tv.png" width="1254" height="1254" alt="" class="row-icon" />
                  <div class="row-label">好きなアニメ</div>
                  <div class="dot-rule" aria-hidden="true"></div>
                  <div class="row-value"><span><span class="preference-item">銀魂、</span><wbr><span class="preference-item">オーバーロード、</span><wbr><span class="preference-item">DEATH NOTE、</span><wbr><span class="preference-item">ノーゲーム・ノーライフ</span></span></div>
                </div>
                <div class="profile-row">
                  <img src="images/profile-hd/icon-clapper.png" width="1254" height="1254" alt="" class="row-icon" />
                  <div class="row-label">好きな映画</div>
                  <div class="dot-rule" aria-hidden="true"></div>
                  <div class="row-value"><span><span class="preference-item">アベンジャーズ/エンドゲーム、</span><wbr><span class="preference-item">時をかける少女、</span><wbr><span class="preference-item">アイアンマン</span></span></div>
                </div>
                <div class="profile-row">
                  <img src="images/profile-hd/icon-calendar.png" width="1254" height="1254" alt="" class="row-icon" />
                  <div class="row-label">生年月日</div>
                  <div class="dot-rule" aria-hidden="true"></div>
                  <div class="row-value"><span>2000年07月24日</span></div>
                </div>
                <div class="profile-row">
                  <img src="images/profile-hd/icon-palette.png" width="1254" height="1254" alt="" class="row-icon" />
                  <div class="row-label">好きな色</div>
                  <div class="dot-rule" aria-hidden="true"></div>
                  <div class="row-value"><span>グリーン</span></div>
                </div>
              </div>
              <img src="images/profile-hd/mountain-bottom.png" width="1448" height="1086" alt="" class="mountain-bottom" />
            </section>
          </article>
        </div>
      </div>
    </main>
    <script>
      (() => {
        const root = document.documentElement;
        const design = { width: 1672, height: 941 };
        const mobileQuery = window.matchMedia("(max-width: 900px)");

        const fitProfile = () => {
          if (mobileQuery.matches) {
            root.style.removeProperty("--fit-scale");
            root.style.removeProperty("--scaled-width");
            root.style.removeProperty("--scaled-height");
            return;
          }

          const scale = Math.min(1, window.innerWidth / design.width, window.innerHeight / design.height);
          root.style.setProperty("--fit-scale", scale.toFixed(5));
          root.style.setProperty("--scaled-width", `${design.width * scale}px`);
          root.style.setProperty("--scaled-height", `${design.height * scale}px`);
        };

        fitProfile();
        window.addEventListener("resize", fitProfile, { passive: true });
        mobileQuery.addEventListener("change", fitProfile);
      })();
    </script>
  </body>
</html>
